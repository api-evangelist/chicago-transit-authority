naftiko: 1.0.0-alpha2
info:
  label: CTA Bus Tracker API — Routes
  description: 'CTA Bus Tracker API — Routes. 3 operations. Lead operation: Get Directions. Self-contained Naftiko capability
    covering one Chicago Transit Authority business surface.'
  tags:
  - Chicago Transit Authority
  - Routes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHICAGO_TRANSIT_AUTHORITY_API_KEY: CHICAGO_TRANSIT_AUTHORITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: cta-bus-tracker-routes
    baseUri: http://www.ctabustracker.com/bustime/api/v2
    description: CTA Bus Tracker API — Routes business capability. Self-contained, no shared references.
    resources:
    - name: getdirections
      path: /getdirections
      operations:
      - name: getdirections
        method: GET
        description: Get Directions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: rt
          in: query
          type: string
          required: true
    - name: getpatterns
      path: /getpatterns
      operations:
      - name: getpatterns
        method: GET
        description: Get Patterns
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: rt
          in: query
          type: string
          required: true
    - name: getroutes
      path: /getroutes
      operations:
      - name: getroutes
        method: GET
        description: Get Routes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: key
      value: '{{env.CHICAGO_TRANSIT_AUTHORITY_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: cta-bus-tracker-routes-rest
    port: 8080
    description: REST adapter for CTA Bus Tracker API — Routes. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/getdirections
      name: getdirections
      description: REST surface for getdirections.
      operations:
      - method: GET
        name: getdirections
        description: Get Directions
        call: cta-bus-tracker-routes.getdirections
        with:
          rt: rest.rt
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/getpatterns
      name: getpatterns
      description: REST surface for getpatterns.
      operations:
      - method: GET
        name: getpatterns
        description: Get Patterns
        call: cta-bus-tracker-routes.getpatterns
        with:
          rt: rest.rt
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/getroutes
      name: getroutes
      description: REST surface for getroutes.
      operations:
      - method: GET
        name: getroutes
        description: Get Routes
        call: cta-bus-tracker-routes.getroutes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cta-bus-tracker-routes-mcp
    port: 9090
    transport: http
    description: MCP adapter for CTA Bus Tracker API — Routes. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-directions
      description: Get Directions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cta-bus-tracker-routes.getdirections
      with:
        rt: tools.rt
      outputParameters:
      - type: object
        mapping: $.
    - name: get-patterns
      description: Get Patterns
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cta-bus-tracker-routes.getpatterns
      with:
        rt: tools.rt
      outputParameters:
      - type: object
        mapping: $.
    - name: get-routes
      description: Get Routes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cta-bus-tracker-routes.getroutes
      outputParameters:
      - type: object
        mapping: $.
