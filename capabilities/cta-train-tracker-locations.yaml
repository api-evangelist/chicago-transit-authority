naftiko: 1.0.0-alpha2
info:
  label: CTA Train Tracker API — Locations
  description: 'CTA Train Tracker API — Locations. 1 operations. Lead operation: Locations. Self-contained Naftiko capability
    covering one Chicago Transit Authority business surface.'
  tags:
  - Chicago Transit Authority
  - Locations
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHICAGO_TRANSIT_AUTHORITY_API_KEY: CHICAGO_TRANSIT_AUTHORITY_API_KEY
capability:
  consumes:
  - type: http
    namespace: cta-train-tracker-locations
    baseUri: http://lapi.transitchicago.com/api/1.0
    description: CTA Train Tracker API — Locations business capability. Self-contained, no shared references.
    resources:
    - name: ttpositions.aspx
      path: /ttpositions.aspx
      operations:
      - name: getpositions
        method: GET
        description: Locations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: key
          in: query
          type: string
          required: true
        - name: rt
          in: query
          type: string
          description: Comma-separated list of route codes.
          required: true
        - name: outputType
          in: query
          type: string
    authentication:
      type: apikey
      key: key
      value: '{{env.CHICAGO_TRANSIT_AUTHORITY_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: cta-train-tracker-locations-rest
    port: 8080
    description: REST adapter for CTA Train Tracker API — Locations. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/ttpositions-aspx
      name: ttpositions-aspx
      description: REST surface for ttpositions.aspx.
      operations:
      - method: GET
        name: getpositions
        description: Locations
        call: cta-train-tracker-locations.getpositions
        with:
          key: rest.key
          rt: rest.rt
          outputType: rest.outputType
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cta-train-tracker-locations-mcp
    port: 9090
    transport: http
    description: MCP adapter for CTA Train Tracker API — Locations. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: locations
      description: Locations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cta-train-tracker-locations.getpositions
      with:
        key: tools.key
        rt: tools.rt
        outputType: tools.outputType
      outputParameters:
      - type: object
        mapping: $.
