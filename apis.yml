apis:
- aid: chicago-transit-authority:customer-alerts-api
  name: CTA Customer Alerts API
  description: >-
    The Customer Alerts API delivers real-time service status, planned outages, and disruption information
    for CTA bus and rail services. It provides both a route-level status feed and per-route or per-station
    detail. Authentication is not required for the public Customer Alerts feeds.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.transitchicago.com/developers/alerts/
  baseURL: http://www.transitchicago.com/api/1.0
  tags:
  - Customer Alerts
  - Real-Time
  - Service Status
  - Transit
  properties:
  - type: Documentation
    url: https://www.transitchicago.com/developers/alerts/
- aid: chicago-transit-authority:gtfs-feed
  name: CTA GTFS Schedule Feed
  description: >-
    CTA publishes a GTFS (General Transit Feed Specification) schedule feed covering the physical layout,
    stop locations, and static schedules for the entire CTA bus and L train system. The feed is a downloadable
    ZIP archive that conforms to the GTFS reference and is updated when CTA service changes.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.transitchicago.com/developers/gtfs/
  baseURL: https://www.transitchicago.com/downloads/sch_data/google_transit.zip
  tags:
  - GTFS
  - Schedule
  - Static
  - Transit
  properties:
  - type: Documentation
    url: https://www.transitchicago.com/developers/gtfs/
  - type: Feed
    url: https://www.transitchicago.com/downloads/sch_data/google_transit.zip
  - type: DataGov
